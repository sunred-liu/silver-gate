name: build-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: 构建一致性 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法哨兵 + 产物漂移检测
        run: node test/check.js

      - name: 依赖边校验（重新构建，失败即退出）
        run: node build.js --quiet
